# Verifies PR #129 (this branch) builds blaspp against ILP64 OpenBLAS in the four
# scenarios that FAIL on master (see the demo/ilp64-openblas64 evidence logs).
# Each log is self-describing and ends in `Built target blaspp` (CMake) or a
# zero configure.py exit + built libblaspp.so (Make). Throwaway: delete once the
# passing logs are captured.
#
#   01-cmake-apt-auto.log     CMake + apt libopenblas64-dev, auto-detect          -> BUILDS (-lopenblas64)
#   02-cmake-conda-suffix.log CMake + conda libopenblas-ilp64, blas_symbol_suffix -> BUILDS (-lopenblas64_)
#   03-make-apt-auto.log      Make configure.py + apt libopenblas64-dev           -> BUILDS (-lopenblas64)
#   04-make-conda-suffix.log  Make configure.py + conda, blas_symbol_suffix=64_   -> BUILDS (-lopenblas64_)
name: ILP64 OpenBLAS fix verify

on:
  workflow_dispatch:
  push:
    branches: [feature/blas-symbol-suffix]
    paths: ['.github/workflows/ilp64-fix-verify.yml',
            'cmake/BLASFinder.cmake', 'config/lapack.py',
            'config/config.h', 'include/blas/mangling.h']

defaults:
  run:
    shell: bash -el {0}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR #129 branch
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- apt
      - name: Install apt ILP64 OpenBLAS (system toolchain)
        run: sudo apt-get update && sudo apt-get install -y libopenblas64-dev cmake g++ make gfortran binutils

      - name: "01 — CMake + apt, auto-detect (EXPECT BUILD)"
        run: |
          set +e
          {
            echo "PR #129 adds -lopenblas64 to the BLAS++ search, so a plain auto-detect"
            echo "finds Ubuntu's ILP64 OpenBLAS with no BLAS_LIBRARIES and no BLA_VENDOR."
            echo "ENV    : stock ubuntu-latest, apt libopenblas64-dev only, system g++."
            echo "RUN    : cmake -Dblas=openblas -Dblas_int='int64_t (ILP64)'  (PR #129)"
            echo "EXPECT : Found BLAS library: -lopenblas64, then [100%] Built target blaspp."
            echo "================================================================"
          } > 01-cmake-apt-auto.log
          cmake -B b01 -S . -Dblas=openblas -Dblas_int="int64_t (ILP64)" \
            -Dbuild_tests=OFF -Dcolor=OFF >> 01-cmake-apt-auto.log 2>&1; rc=$?
          if [ $rc -eq 0 ]; then cmake --build b01 -j >> 01-cmake-apt-auto.log 2>&1; rc=$?; fi
          echo "----------------------------------------------------------------" >> 01-cmake-apt-auto.log
          echo "cmake exit code: $rc  (0 = configured/built, as claimed)"  >> 01-cmake-apt-auto.log
          ls b01/lib*blaspp* >> 01-cmake-apt-auto.log 2>&1

      - name: "03 — Make build + apt, configure.py auto-detect (EXPECT BUILD)"
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/03-make-apt-auto.log"
          {
            echo "The same -lopenblas64 probe is now in config/lapack.py, so the Make build"
            echo "auto-detects Ubuntu's ILP64 OpenBLAS too (not a CMake-only fix)."
            echo "ENV    : stock ubuntu-latest, apt libopenblas64-dev only, system g++."
            echo "RUN    : python3 configure.py blas=openblas blas_int=int64 && make lib  (PR #129)"
            echo "EXPECT : configure.py exit 0, then libblaspp.so built."
            echo "================================================================"
          } > "$LOG"
          ( cd "$GITHUB_WORKSPACE" && python3 configure.py blas=openblas blas_int=int64 ) >> "$LOG" 2>&1; rc=$?
          if [ $rc -eq 0 ]; then make -C "$GITHUB_WORKSPACE" -j lib >> "$LOG" 2>&1; rc=$?; fi
          echo "----------------------------------------------------------------" >> "$LOG"
          echo "configure.py+make exit code: $rc  (0 = configured/built, as claimed)" >> "$LOG"
          ls "$GITHUB_WORKSPACE"/lib/lib*blaspp* >> "$LOG" 2>&1
          # wipe objects + generated config so the conda Make run rebuilds cleanly
          make -C "$GITHUB_WORKSPACE" distclean >/dev/null 2>&1

      # -------------------------------------------------------------- conda
      - name: Set up conda-forge
        uses: conda-incubator/setup-miniconda@v3
        with: { miniforge-version: latest, channels: conda-forge, channel-priority: strict, activate-environment: ilp64 }

      - name: Install conda ILP64 OpenBLAS + conda toolchain
        run: conda install -y libopenblas-ilp64 cmake make cxx-compiler

      - name: "02 — CMake + conda, blas_symbol_suffix=64_ (EXPECT BUILD)"
        run: |
          set +e
          # conda's runtime libopenblas-ilp64 ships only libopenblas64_.so.0; a build
          # env also has the unversioned .so that -lopenblas64_ needs, so recreate it.
          ln -sf libopenblas64_.so.0 "$CONDA_PREFIX/lib/libopenblas64_.so"
          export CPATH="$CONDA_PREFIX/include" LIBRARY_PATH="$CONDA_PREFIX/lib" LD_LIBRARY_PATH="$CONDA_PREFIX/lib"
          RPATH="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -Wl,-rpath-link,$CONDA_PREFIX/lib"
          {
            echo "blas_symbol_suffix=64_ links -lopenblas64_ AND mangles calls to dgemm_64_,"
            echo "so a plain auto-detect builds against conda-forge's ILP64 OpenBLAS."
            echo "ENV    : conda-forge libopenblas-ilp64 (libopenblas64_, dgemm_64_), conda g++."
            echo "RUN    : cmake -Dblas=openblas -Dblas_int='int64_t (ILP64)' -Dblas_symbol_suffix=64_  (PR #129)"
            echo "EXPECT : Found BLAS library: -lopenblas64_, then [100%] Built target blaspp."
            echo "================================================================"
          } > 02-cmake-conda-suffix.log
          cmake -B b02 -S . -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_EXE_LINKER_FLAGS="$RPATH" \
            -Dblas=openblas -Dblas_int="int64_t (ILP64)" -Dblas_symbol_suffix=64_ \
            -Dbuild_tests=OFF -Dcolor=OFF >> 02-cmake-conda-suffix.log 2>&1; rc=$?
          if [ $rc -eq 0 ]; then cmake --build b02 -j >> 02-cmake-conda-suffix.log 2>&1; rc=$?; fi
          echo "----------------------------------------------------------------" >> 02-cmake-conda-suffix.log
          echo "cmake exit code: $rc  (0 = configured/built, as claimed)"  >> 02-cmake-conda-suffix.log
          ls b02/lib*blaspp* >> 02-cmake-conda-suffix.log 2>&1

      - name: "04 — Make build + conda, blas_symbol_suffix=64_ (EXPECT BUILD)"
        run: |
          set +e
          ln -sf libopenblas64_.so.0 "$CONDA_PREFIX/lib/libopenblas64_.so"
          export CXX="$CXX" CPATH="$CONDA_PREFIX/include" LIBRARY_PATH="$CONDA_PREFIX/lib" LD_LIBRARY_PATH="$CONDA_PREFIX/lib"
          export LDFLAGS="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib"
          LOG="$GITHUB_WORKSPACE/04-make-conda-suffix.log"
          {
            echo "config/lapack.py now honors blas_symbol_suffix too: it probes -lopenblas64_"
            echo "and writes BLAS_FORTRAN_SUFFIX into defines.h, so the Make build links dgemm_64_."
            echo "ENV    : conda-forge libopenblas-ilp64 (libopenblas64_, dgemm_64_), conda g++."
            echo "RUN    : python3 configure.py blas=openblas blas_int=int64 blas_symbol_suffix=64_ && make lib  (PR #129)"
            echo "EXPECT : configure.py exit 0 (BLAS_FORTRAN_SUFFIX in defines.h), then libblaspp.so built."
            echo "================================================================"
          } > "$LOG"
          ( cd "$GITHUB_WORKSPACE" && python3 configure.py blas=openblas blas_int=int64 blas_symbol_suffix=64_ ) >> "$LOG" 2>&1; rc=$?
          echo "---- generated include/blas/defines.h (grep SUFFIX) ----" >> "$LOG"
          grep -n "FORTRAN_SUFFIX\|ILP64\|FORTRAN_ADD" "$GITHUB_WORKSPACE/include/blas/defines.h" >> "$LOG" 2>&1
          if [ $rc -eq 0 ]; then make -C "$GITHUB_WORKSPACE" -j lib >> "$LOG" 2>&1; rc=$?; fi
          echo "----------------------------------------------------------------" >> "$LOG"
          echo "configure.py+make exit code: $rc  (0 = configured/built, as claimed)" >> "$LOG"
          ls "$GITHUB_WORKSPACE"/lib/lib*blaspp* >> "$LOG" 2>&1

      - name: Summary (console pass/fail at a glance)
        if: always()
        run: |
          for f in 01-cmake-apt-auto 02-cmake-conda-suffix 03-make-apt-auto 04-make-conda-suffix; do
            echo "===== $f.log ====="
            grep -E "Built target blaspp|Found BLAS library|passed|exit code:" "$f.log" || echo "(marker not found)"
          done

      - name: Upload the verify logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilp64-fix-verify
          path: |
            01-cmake-apt-auto.log
            02-cmake-conda-suffix.log
            03-make-apt-auto.log
            04-make-conda-suffix.log
          if-no-files-found: warn
